<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGE Project &amp; Billing Command Centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<style>
:root{
  --bg:#F2F4F6;--surface:#FFFFFF;--raised:#EBEEF1;--ink:#14181D;--muted:#55606B;--faint:#86909A;--rule:#DCE1E6;
  --brand:#FF5757;--brand-ink:#C42E2E;--brand-soft:#FFE3E3;
  --blue:#2F5E86;--blue-soft:#DCE8F3;--amber:#A86400;--amber-fill:#E2A23B;--amber-soft:#FBEFD9;--green:#1D7449;--green-soft:#DDF1E6;
  --s-inv:#14181D;--s-prog:#2F5E86;--s-open:#A3AEB9;--s-done:#E2A23B;--s-canc:#D2D7DC;
  --hero:#14181D;--hero-text:#F4F6F8;--hero-muted:#AEB7C0;
  --shadow:0 1px 0 rgba(20,24,29,.04);
  --head:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1114;--surface:#161A1F;--raised:#1E242A;--ink:#ECEFF2;--muted:#A9B2BB;--faint:#7A848E;--rule:#2A3138;
  --brand:#FF5757;--brand-ink:#FF8080;--brand-soft:#3A1E20;
  --blue:#7FB0DB;--blue-soft:#1D2C3A;--amber:#F0B44C;--amber-fill:#E2A23B;--amber-soft:#33291A;--green:#62CF92;--green-soft:#183025;
  --s-inv:#E6EAEE;--s-prog:#5E95C6;--s-open:#5D6873;--s-done:#E2A23B;--s-canc:#3A424A;
  --hero:#1A1F25;--hero-text:#F4F6F8;--hero-muted:#AEB7C0;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E1114;--surface:#161A1F;--raised:#1E242A;--ink:#ECEFF2;--muted:#A9B2BB;--faint:#7A848E;--rule:#2A3138;
  --brand:#FF5757;--brand-ink:#FF8080;--brand-soft:#3A1E20;
  --blue:#7FB0DB;--blue-soft:#1D2C3A;--amber:#F0B44C;--amber-fill:#E2A23B;--amber-soft:#33291A;--green:#62CF92;--green-soft:#183025;
  --s-inv:#E6EAEE;--s-prog:#5E95C6;--s-open:#5D6873;--s-done:#E2A23B;--s-canc:#3A424A;
  --hero:#1A1F25;--hero-text:#F4F6F8;--hero-muted:#AEB7C0;color-scheme:dark;}
*{box-sizing:border-box}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);margin:0;letter-spacing:-.01em}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.num{font-family:var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
/* Sidebar */
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--rule);display:flex;flex-direction:column;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 22px}
.mark{width:40px;height:40px;background:#000;display:grid;place-items:center;border-radius:6px;flex:none}
.mark span{font-family:var(--head);font-weight:800;color:#FF5757;font-size:14px;letter-spacing:.02em}
.brand b{display:block;font-family:var(--head);font-size:14px;line-height:1.15}
.brand small{color:var(--muted);font-size:12px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:11px;width:100%;border:0;background:none;padding:9px 10px;border-radius:7px;cursor:pointer;color:var(--muted);text-align:left;font-weight:500;position:relative;min-height:40px}
.nav button svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button:hover{background:var(--raised);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--raised);color:var(--ink);font-weight:600}
.nav button[aria-current="page"]::before{content:"";position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--brand);border-radius:0 3px 3px 0}
.nav .count{margin-left:auto;font-size:11px;background:var(--brand-soft);color:var(--brand-ink);padding:1px 7px;border-radius:10px;font-weight:600}
.side-foot{margin-top:auto;font-size:12px;overflow-wrap:anywhere;color:var(--faint);padding:12px 6px 0;border-top:1px solid var(--rule)}
.side-foot strong{color:var(--muted);font-weight:600}
/* Top bar */
.main{min-width:0}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule);padding:14px 28px 12px}
.top-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;font-weight:700;margin-right:auto}
.top .sub{color:var(--muted);font-size:13px;font-weight:400;font-family:var(--body);margin-left:8px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fsel{display:flex;flex-direction:column;gap:2px}
.fsel label{font-size:11px;color:var(--muted);font-weight:500;padding-left:2px}
select,.search input{height:34px;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:0 28px 0 10px;min-width:118px;max-width:190px;cursor:pointer;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 15px) 15px,calc(100% - 10px) 15px;background-size:5px 5px;background-repeat:no-repeat}
select.on{border-color:var(--ink);font-weight:600}
.search{position:relative;align-self:flex-end}
.search input{background-image:none;padding:0 10px 0 32px;min-width:250px;cursor:text}
.search svg{position:absolute;left:10px;top:9px;width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.8}
.btn{height:34px;border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:0 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn[hidden]{display:none}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{font-size:12px;background:var(--ink);color:var(--bg);padding:3px 6px 3px 10px;border-radius:14px;display:inline-flex;gap:6px;align-items:center}
.chip button{border:0;background:rgba(255,255,255,.18);color:inherit;border-radius:50%;width:18px;height:18px;cursor:pointer;line-height:1;padding:0}
.scope-note{font-size:12px;color:var(--muted);margin-top:6px}
/* Content */
.content{padding:24px 28px 60px;max-width:1500px}
.grid{display:grid;gap:16px}
.g-12{grid-template-columns:repeat(12,minmax(0,1fr))}
.span-12{grid-column:span 12}.span-8{grid-column:span 8}.span-7{grid-column:span 7}.span-6{grid-column:span 6}.span-5{grid-column:span 5}.span-4{grid-column:span 4}.span-3{grid-column:span 3}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:20px 20px 18px;min-width:0;box-shadow:var(--shadow)}
.panel h3{font-size:15px;font-weight:700}
.panel .q{color:var(--muted);font-size:13px;margin-top:2px}
.panel-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.take{font-size:13px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);color:var(--ink)}
.take b{font-weight:600}
.chart{position:relative;height:280px}
.chart.tall{height:360px}.chart.short{height:220px}
/* Hero */
.hero{background:var(--hero);color:var(--hero-text);border-radius:14px;padding:28px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:28px;position:relative;overflow:hidden;margin-bottom:16px}
.hero::after{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--brand)}
.hero h2{font-size:clamp(24px,3vw,36px);line-height:1.12;font-weight:700;max-width:22ch;letter-spacing:-.02em}
.hero p{color:var(--hero-muted);max-width:62ch;margin:12px 0 0;font-size:14.5px}
.hero-stats{display:flex;gap:28px;flex-wrap:wrap;margin-top:22px}
.hero-stats div{min-width:120px}
.hero-stats .num{font-size:24px;font-weight:700;color:#fff;display:block}
.hero-stats span{font-size:12px;color:var(--hero-muted)}
.health{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;padding:16px}
.health h4{font-size:13px;font-weight:600;color:var(--hero-muted);font-family:var(--body)}
.ring{display:flex;align-items:center;gap:14px;margin:10px 0 12px}
.ring svg{width:86px;height:86px;flex:none}
.ring .big{font-size:34px;font-weight:800;line-height:1}
.ring small{display:block;color:var(--hero-muted);font-size:12px;margin-top:4px}
.sub-scores{display:grid;gap:6px}
.sub-scores div{display:grid;grid-template-columns:96px 1fr 30px;gap:8px;align-items:center;font-size:12px;color:var(--hero-muted)}
.bar{height:6px;background:rgba(255,255,255,.12);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:4px}
.bar i.warn{background:var(--amber-fill)}.bar i.bad{background:var(--brand)}
.health details{margin-top:10px;font-size:12px;color:var(--hero-muted)}
.health summary{cursor:pointer;color:#fff}
/* KPI strip (title-block style) */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin-bottom:16px;overflow:hidden}
.kpi{padding:16px 18px;border-right:1px solid var(--rule);min-width:0}
.kpi:last-child{border-right:0}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:500;display:flex;gap:6px;align-items:center}
.kpi .val{font-size:26px;font-weight:700;margin-top:4px;display:block;white-space:nowrap}
.kpi .cmp{font-size:12px;color:var(--muted);margin-top:2px}
.up{color:var(--green);font-weight:600}.down{color:var(--brand-ink);font-weight:600}.warnt{color:var(--amber);font-weight:600}
.info{width:15px;height:15px;border-radius:50%;border:1px solid var(--faint);color:var(--faint);font-size:10px;display:inline-grid;place-items:center;cursor:help;font-weight:600}
/* Insight lists */
.ins{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.ins li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:13px;line-height:1.45}
.ins .dot{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;font-weight:700;font-family:var(--head)}
.dot.g{background:var(--green-soft);color:var(--green)}.dot.r{background:var(--brand-soft);color:var(--brand-ink)}.dot.a{background:var(--amber-soft);color:var(--amber)}.dot.b{background:var(--blue-soft);color:var(--blue)}
.ins b{font-weight:600}
.tabs{display:flex;gap:4px;background:var(--raised);padding:3px;border-radius:8px;width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:5px 11px;border-radius:6px;cursor:pointer;font-size:12.5px;font-weight:500;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* Tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--rule);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-weight:600;color:var(--muted);font-size:12px;background:var(--raised);position:sticky;top:0;white-space:nowrap}
th button{border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0;display:inline-flex;gap:4px;align-items:center}
th[aria-sort="ascending"] button::after{content:"▲";font-size:9px}th[aria-sort="descending"] button::after{content:"▼";font-size:9px}
td.r,th.r{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--raised)}
.desc{max-width:420px;min-width:220px}
.desc small{display:block;color:var(--muted);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-inv{background:var(--raised);color:var(--ink)}.p-prog{background:var(--blue-soft);color:var(--blue)}.p-open{background:var(--raised);color:var(--muted)}.p-done{background:var(--amber-soft);color:var(--amber)}.p-canc{background:var(--raised);color:var(--faint)}
.p-high{background:var(--green-soft);color:var(--green)}.p-med{background:var(--amber-soft);color:var(--amber)}.p-risk{background:var(--brand-soft);color:var(--brand-ink)}.p-paid{background:var(--raised);color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;min-width:96px}
.prog .t{flex:1;height:6px;background:var(--raised);border-radius:4px;overflow:hidden}
.prog .t i{display:block;height:100%;background:var(--s-prog)}
.prog span{font-size:12px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.pager .btns{display:flex;gap:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.empty{padding:40px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--head);font-size:16px;margin-bottom:4px}
/* Gantt */
.gantt{border:1px solid var(--rule);border-radius:10px;overflow-x:auto}
.g-inner{min-width:820px}
.g-row{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--rule);min-height:36px;cursor:pointer}
.g-row:hover{background:var(--raised)}
.g-row:last-child{border-bottom:0}
.g-lbl{padding:7px 12px;font-size:12.5px;border-right:1px solid var(--rule);overflow:hidden}
.g-lbl b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.g-lbl small{color:var(--muted)}
.g-track{position:relative}
.g-bar{position:absolute;top:10px;height:16px;border-radius:4px;background:var(--s-open);overflow:hidden;min-width:4px}
.g-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--s-prog)}
.g-bar.late{outline:2px solid var(--brand);outline-offset:1px}
.g-bar.done{background:var(--s-done)}
.g-head{display:grid;grid-template-columns:300px 1fr;border-bottom:1px solid var(--rule);background:var(--raised);font-size:11px;color:var(--muted);position:sticky;top:0}
.g-head .g-track{height:28px}
.g-tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule);padding:6px 0 0 4px;white-space:nowrap}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px dashed var(--brand);z-index:2}
.g-tl{font-size:10px;position:absolute;top:2px;left:4px;color:var(--brand-ink);font-weight:600;white-space:nowrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* Drawer */
.scrim{position:fixed;inset:0;background:rgba(10,12,15,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--surface);z-index:41;transform:translateX(100%);transition:transform .25s cubic-bezier(.2,.7,.2,1);display:flex;flex-direction:column;border-left:1px solid var(--rule);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer.open{transform:none}
.d-head{padding:20px 22px 14px;border-bottom:1px solid var(--rule);display:flex;gap:12px;align-items:flex-start}
.d-head h3{font-size:17px;line-height:1.3}
.d-head .x{margin-left:auto}
.d-body{padding:18px 22px 40px;overflow-y:auto}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-bottom:18px}
.facts div{background:var(--surface);padding:10px 12px}
.facts span{display:block;font-size:11.5px;color:var(--muted)}
.facts b{font-weight:600;font-size:13.5px}.facts .pill{width:max-content}
.steps{list-style:none;margin:0 0 18px;padding:0;position:relative}
.steps li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:6px 0;font-size:13px;align-items:center;position:relative}
.steps li::before{content:"";position:absolute;left:9px;top:22px;bottom:-8px;width:2px;background:var(--rule)}
.steps li:last-child::before{display:none}
.steps .s{width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);background:var(--surface);z-index:1}
.steps .s.ok{background:var(--ink);border-color:var(--ink)}
.steps .s.miss{border-color:var(--amber-fill)}.steps .s.plan{border-style:dashed;border-color:var(--muted)}
.steps em{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12.5px}
.note{background:var(--raised);border-radius:8px;padding:12px 14px;font-size:13px;white-space:pre-wrap;margin-bottom:10px}
.note b{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
/* What-if */
.whatif{display:grid;gap:14px}
.wi-row{display:grid;grid-template-columns:150px 1fr 54px;gap:12px;align-items:center;font-size:13px}
.wi-row input{width:100%;accent-color:var(--ink)}
.wi-out{display:flex;gap:24px;flex-wrap:wrap;padding-top:12px;border-top:1px solid var(--rule)}
.wi-out .num{font-size:26px;font-weight:700;display:block}
.wi-out span:not(.num){font-size:12px;color:var(--muted)}
.mini-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.mini-stats div{border-left:3px solid var(--rule);padding:2px 0 2px 12px}
.mini-stats .num{font-size:22px;font-weight:700;display:block}
.mini-stats span:not(.num){font-size:12px;color:var(--muted)}
.mini-stats .r{border-color:var(--brand)}.mini-stats .a{border-color:var(--amber-fill)}.mini-stats .g{border-color:var(--green)}.mini-stats .b{border-color:var(--blue)}
.funnel{display:grid;gap:8px}
.f-row{display:grid;grid-template-columns:150px 1fr 110px;gap:12px;align-items:center;font-size:13px}
.f-bar{height:26px;background:var(--raised);border-radius:5px;overflow:hidden}
.f-bar i{display:block;height:100%;border-radius:5px;background:var(--s-prog)}
[data-look="3d"] .f-bar{box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
[data-look="3d"] .f-bar i{background-image:linear-gradient(180deg,rgba(255,255,255,.32) 0%,rgba(255,255,255,.06) 45%,rgba(0,0,0,.18) 100%);box-shadow:0 3px 6px rgba(0,0,0,.18),inset 0 -2px 0 rgba(0,0,0,.18)}
[data-look="3d"] .g-bar{background-image:linear-gradient(180deg,rgba(255,255,255,.3),rgba(0,0,0,.16));box-shadow:2px 3px 5px rgba(0,0,0,.2)}
[data-look="3d"] .g-bar i{background-image:linear-gradient(180deg,rgba(255,255,255,.28),rgba(0,0,0,.18))}
[data-look="3d"] .prog .t{box-shadow:inset 0 1px 2px rgba(0,0,0,.15)}
[data-look="3d"] .prog .t i{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(0,0,0,.15))}
[data-look="3d"] .panel{box-shadow:0 1px 0 rgba(20,24,29,.04),0 8px 24px -12px rgba(20,24,29,.18)}
.f-bar{position:relative}.f-bar b{position:absolute;left:8px;top:50%;transform:translateY(-50%);font-size:11.5px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.f-row .r{text-align:right;font-variant-numeric:tabular-nums}
.heat td{text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px}
.dq-grp{border:1px solid var(--rule);border-radius:10px;margin-bottom:10px;background:var(--surface)}
.dq-grp summary{padding:12px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:600}
.dq-grp summary .n{margin-left:auto;font-family:var(--head)}
.dq-grp ul{margin:0;padding:0 16px 14px 36px;font-size:13px;color:var(--muted);max-height:260px;overflow:auto}
details.data{margin-top:10px;font-size:12.5px}
details.data summary{cursor:pointer;color:var(--muted)}
details.data table{margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:13px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1200px){.kpis{grid-template-columns:repeat(3,1fr)}.kpi:nth-child(3){border-right:0}.kpi:nth-child(-n+3){border-bottom:1px solid var(--rule)}
  .span-8,.span-7,.span-5,.span-4{grid-column:span 12}.span-6{grid-column:span 12}.span-3{grid-column:span 6}}
@media (max-width:900px){.app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;align-items:center;padding:10px 12px;gap:10px;border-right:0;border-bottom:1px solid var(--rule);overflow-x:auto}
  .brand{padding:0}.brand div{display:none}.side-foot{display:none}
  .nav{flex-direction:row}.nav button{white-space:nowrap}.nav button span.t{display:none}.nav button[aria-current="page"] span.t{display:inline}.nav button[aria-current="page"]::before{display:none}
  .hero{grid-template-columns:1fr}.top{padding:12px 16px;position:static}.content{padding:16px}
  .g-row,.g-head{grid-template-columns:200px 1fr}}
@media (max-width:600px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi{border-right:1px solid var(--rule)!important;border-bottom:1px solid var(--rule)}.kpi:nth-child(2n){border-right:0!important}
  .span-3{grid-column:span 12}.fsel{flex:1 1 45%}select{max-width:none;width:100%}.search{flex:1 1 100%;width:100%}.search input{width:100%;min-width:0}
  .f-row{grid-template-columns:100px 1fr 80px}.wi-row{grid-template-columns:110px 1fr 46px}.facts{grid-template-columns:1fr}
  .hero{padding:22px 20px}.kpi .val{font-size:22px}}
@media print{.side,.top .filters,.top .btn{display:none}.app{display:block}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Sections">
    <div class="brand"><div class="mark" aria-hidden="true"><span>MGE</span></div><div><b>Meraki Global Energy</b><small>Projects &amp; billing</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot" id="sideFoot"><strong>Loading data…</strong></div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="top-row">
        <h1 id="title">Overview</h1>
        <button class="btn" id="exportBtn" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>Export CSV</button>
        <button class="btn" id="lookBtn" aria-pressed="true" title="Switch between 3D and flat charts"><svg viewBox="0 0 24 24"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9z"/><path d="M4 7.5 12 12l8-4.5M12 12v9"/></svg><span>3D charts</span></button>
        <button class="btn" id="themeBtn" aria-label="Switch colour theme"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg><span>Dark</span></button>
      </div>
      <div class="filters" id="filters"></div>
      <div class="chips" id="chips"></div>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dTitle" aria-hidden="true">
  <div class="d-head"><div><div id="dSub" style="font-size:12px;color:var(--muted)"></div><h3 id="dTitle"></h3></div><button class="btn x" id="dClose" aria-label="Close details">Close</button></div>
  <div class="d-body" id="dBody"></div>
</aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============================================================
   DATA (cleaned from the uploaded workbook — see Data quality view)
   ============================================================ */
/* Data is loaded from data.json at start-up (see BOOT). These are filled by initData(). */
let RAW, TODAY, Y, AS_MS, P, V, bySO = {}, byPO = {}, MONTHS = [], PASTM = [], FUTM = [], LASTM = null, CURM = null, WEEK = {cur:'Latest week',prev:'Previous week'};
const MN = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAY = 864e5;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const isD = s => /^\d{4}-\d{2}-\d{2}$/.test(s||'');
const pd = s => isD(s) ? new Date(s+'T00:00:00Z') : null;
const fmtDate = d => d ? d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric',timeZone:'UTC'}) : '—';
const sum = (a,f) => a.reduce((s,x)=>s+(f?f(x):x||0),0);
const median = a => { if(!a.length) return null; const s=[...a].sort((x,y)=>x-y); const m=Math.floor(s.length/2); return s.length%2?s[m]:(s[m-1]+s[m])/2; };
const groupBy = (a,k) => a.reduce((m,x)=>{const key=typeof k==='function'?k(x):x[k]; (m[key]=m[key]||[]).push(x); return m;},{});
function short(v){ if(v==null||isNaN(v)) return '—'; const a=Math.abs(v);
  if(a>=1e6) return (v/1e6).toFixed(a>=1e8?0:a>=1e7?1:2)+'M'; if(a>=1e3) return Math.round(v/1e3)+'K'; return Math.round(v).toString(); }
const aed = v => v==null?'—':'AED '+short(v);
const full = v => v==null?'—':'AED '+Math.round(v).toLocaleString('en-US');
const pct = (v,d=0) => v==null||!isFinite(v)?'—':(v*100).toFixed(d)+'%';
const n0 = v => Math.round(v).toLocaleString('en-US');

const STAGES = ['OPEN PO','IN PROGRESS','WORK COMPLETED','INVOICED','CANCELLED'];
const STAGE_LABEL = {'OPEN PO':'Open PO','IN PROGRESS':'In progress','WORK COMPLETED':'Work completed','INVOICED':'Invoiced','CANCELLED':'Cancelled'};
const STAGE_CLS = {'OPEN PO':'p-open','IN PROGRESS':'p-prog','WORK COMPLETED':'p-done','INVOICED':'p-inv','CANCELLED':'p-canc'};
const STAGE_VAR = {'OPEN PO':'--s-open','IN PROGRESS':'--s-prog','WORK COMPLETED':'--s-done','INVOICED':'--s-inv','CANCELLED':'--s-canc'};
const GROUPS = ['SERVICE','SUPPLY','SUPPLY/SERVICE'];
const GROUP_LABEL = {'SERVICE':'Service','SUPPLY':'Supply','SUPPLY/SERVICE':'Supply & service'};
const titleCase = s => s.toLowerCase().replace(/(^|[\s/(-])([a-z])/g,(m,a,b)=>a+b.toUpperCase());

function initData(raw){
RAW = raw;
if(!isD(RAW.asof)) throw new Error('data.json has no valid "asof" date');
TODAY = pd(RAW.asof); Y = TODAY.getUTCFullYear(); AS_MS = Date.UTC(Y, TODAY.getUTCMonth(), 1);
WEEK = RAW.weeks || WEEK;
/* ---------- Projects ---------- */
P = RAW.projects.map(r => {
  const o = {...r};
  o.val = typeof r.po === 'number' ? r.po : null;
  o.v = o.val || 0;
  o.lpoD = pd(r.lpo); o.psD = pd(r.ps); o.pfD = pd(r.pf); o.asD = pd(r.as); o.afD = pd(r.af);
  o.active = ['OPEN PO','IN PROGRESS','WORK COMPLETED'].includes(r.st);
  o.late = (r.st==='OPEN PO'||r.st==='IN PROGRESS') && o.pfD && o.pfD < TODAY;
  o.daysLate = o.late ? Math.round((TODAY-o.pfD)/DAY) : 0;
  o.repOk = isD(r.rep) || r.rep==='APPROVED' || /^MGE-/.test(r.rep);
  o.wsOk = isD(r.ws); o.waOk = isD(r.wa);
  o.seOk = isD(r.sed) || (r.sen && r.sen!=='-');
  o.invOk = !!(r.inv && r.inv!=='-');
  o.note = (r.wc && r.wc!=='-') ? r.wc : '';
  o.note40 = (r.wp && r.wp!=='-' && r.wp!=='COMPLETED') ? r.wp : '';
  o.cl = (r.cl||'').trim(); o.co = (r.co||'').trim(); o.grp = r.grp||''; o.pe = r.pe||''; o.se = r.se||''; o.so = r.so||''; o.cpo = r.cpo||'';
  o.search = (r.so+' '+r.ds+' '+r.cl+' '+r.co+' '+r.cpo+' '+r.pe+' '+r.se+' '+r.inv).toLowerCase();
  return o;
});
/* ---------- Invoice plan ---------- */
bySO = {}; byPO = {}; P.forEach(p => { if(p.so && !bySO[p.so]) bySO[p.so]=p; if(p.cpo && !/PENDING|TO BE/i.test(p.cpo) && !byPO[p.cpo]) byPO[p.cpo]=p; });
MONTHS = (RAW.months||[]).map((m,i)=>{ const s=pd(m.start); return {...m, i, l:m.label, s:+s, past: +s < AS_MS}; });
PASTM = MONTHS.filter(m=>m.past); FUTM = MONTHS.filter(m=>!m.past);
LASTM = PASTM[PASTM.length-1] || null; CURM = FUTM[0] || null;
V = RAW.invoices.map(r => {
  const o = {...r}; const p = bySO[r.so] || byPO[r.pon] || null;
  o.proj = p || null; o.st = p ? p.st : null; o.pct = p ? p.pct : null;
  o.paid = r.pay === 'PAID IN FULL';
  o.conf = o.paid ? 'paid' : (!p ? 'risk' : (p.st==='WORK COMPLETED'||p.st==='INVOICED'||p.pct>=0.85) ? 'high' : p.pct>=0.5 ? 'med' : 'risk');
  o.imD = pd(r.im);
  o.cl = (r.cl||'').trim(); o.so = r.so||''; o.pon = r.pon||'';
  o.plan = MONTHS.map((m,i)=>(r.plan||[])[i]||0); o.act = MONTHS.map((m,i)=>(r.act||[])[i]||0);
  o.search = (o.so+' '+r.ds+' '+o.cl+' '+o.pon).toLowerCase();
  return o;
});
}
const mShort = m => m ? m.l.split(' ')[0] : '';
const mLong = m => m ? new Date(m.s).toLocaleDateString('en-GB',{month:'long',timeZone:'UTC'}) : '';
const futRange = () => FUTM.length ? (FUTM.length>1 ? `${mShort(FUTM[0])}–${mShort(FUTM[FUTM.length-1])}` : mShort(FUTM[0])) : 'upcoming months';
const sumM = (vs, key, ms) => sum(ms, m => sum(vs, v => v[key][m.i]));
const CONF_LABEL = {high:'High confidence',med:'Medium confidence',risk:'At risk',paid:'Paid'};
const CONF_CLS = {high:'p-high',med:'p-med',risk:'p-risk',paid:'p-paid'};

/* ============================================================
   STATE, FILTERS
   ============================================================ */
const F = {yr:'all',grp:'all',co:'all',cl:'all',pe:'all',st:'all',q:''};
const FILTER_DEFS = [
  {k:'yr',label:'Tracker year',opts:()=>[...new Set(P.map(p=>p.yr))].sort((a,b)=>b-a).map(String)},
  {k:'grp',label:'Business line',opts:()=>GROUPS,fmt:g=>GROUP_LABEL[g]},
  {k:'cl',label:'End client',opts:()=>Object.entries(groupBy(P,'cl')).sort((a,b)=>sum(b[1],x=>x.v)-sum(a[1],x=>x.v)).map(e=>e[0])},
  {k:'co',label:'Principal / brand',opts:()=>Object.entries(groupBy(P,'co')).sort((a,b)=>b[1].length-a[1].length).map(e=>e[0])},
  {k:'pe',label:'Project engineer',opts:()=>Object.keys(groupBy(P.filter(p=>p.pe),'pe')).sort()},
  {k:'st',label:'Project status',opts:()=>STAGES,fmt:s=>STAGE_LABEL[s]},
];
const passP = (p, skip) => (skip==='yr'||F.yr==='all'||String(p.yr)===F.yr) && (F.grp==='all'||p.grp===F.grp) && (F.co==='all'||p.co===F.co)
  && (F.cl==='all'||p.cl===F.cl) && (F.pe==='all'||p.pe===F.pe) && (F.st==='all'||p.st===F.st) && (!F.q||p.search.includes(F.q));
const fP = skip => P.filter(p=>passP(p,skip));
const fV = () => V.filter(v => (F.grp==='all'||v.grp===F.grp) && (F.cl==='all'||v.cl===F.cl) && (!F.q||v.search.includes(F.q))
  && (F.pe==='all'||(v.proj&&v.proj.pe===F.pe)) && (F.co==='all'||(v.proj&&v.proj.co===F.co)));
const anyFilter = () => Object.entries(F).some(([k,v])=>k==='q'?!!v:v!=='all');

function buildFilters(){
  const box = $('#filters');
  box.innerHTML = FILTER_DEFS.map(d => `<div class="fsel"><label for="f-${d.k}">${d.label}</label><select id="f-${d.k}" data-k="${d.k}"><option value="all">All</option>${d.opts().map(o=>`<option value="${esc(o)}">${esc(d.fmt?d.fmt(o):o)}</option>`).join('')}</select></div>`).join('')
   + `<div class="search"><label class="sr" for="q">Search jobs</label><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search SO, PO, job, client…"></div>
      <button class="btn" id="resetBtn" style="align-self:flex-end" hidden>Reset filters</button>`;
  box.querySelectorAll('select').forEach(s => s.addEventListener('change', e => { F[s.dataset.k]=s.value; onFilter(); }));
  let t; $('#q').addEventListener('input', e => { clearTimeout(t); t=setTimeout(()=>{F.q=e.target.value.trim().toLowerCase(); onFilter();},180); });
  $('#resetBtn').addEventListener('click', resetFilters);
}
function setFilter(k,v){ F[k]=v; const s=$('#f-'+k); if(s) s.value=v; onFilter(); toast(`Filtered to ${FILTER_DEFS.find(d=>d.k===k).label.toLowerCase()}: ${k==='st'?STAGE_LABEL[v]:k==='grp'?GROUP_LABEL[v]:v}`); }
function resetFilters(){ Object.keys(F).forEach(k=>F[k]=k==='q'?'':'all'); document.querySelectorAll('#filters select').forEach(s=>s.value='all'); $('#q').value=''; onFilter(); }
function onFilter(){ regPage=0; renderChips(); render(); }
function renderChips(){
  const c=[]; FILTER_DEFS.forEach(d=>{ const s=$('#f-'+d.k); s.classList.toggle('on',F[d.k]!=='all'); if(F[d.k]!=='all') c.push(`<span class="chip">${d.label}: ${esc(d.fmt?d.fmt(F[d.k]):F[d.k])}<button aria-label="Remove ${d.label} filter" data-k="${d.k}">×</button></span>`); });
  if(F.q) c.push(`<span class="chip">Search: “${esc(F.q)}”<button aria-label="Clear search" data-k="q">×</button></span>`);
  $('#chips').innerHTML = c.join('');
  $('#chips').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; if(k==='q'){F.q='';$('#q').value='';} else {F[k]='all'; $('#f-'+k).value='all';} onFilter(); }));
  $('#resetBtn').hidden = !anyFilter();
}

/* ============================================================
   CHART HELPERS
   ============================================================ */
const charts = {};
const cssv = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function chartDefaults(){
  if(!window.Chart) return;
  Chart.defaults.font.family = '"IBM Plex Sans", system-ui, sans-serif';
  Chart.defaults.font.size = 12;
  Chart.defaults.color = cssv('--muted');
  Chart.defaults.borderColor = cssv('--rule');
  Chart.defaults.plugins.legend.labels.boxWidth = 12;
  Chart.defaults.plugins.legend.labels.boxHeight = 12;
  Chart.defaults.plugins.tooltip.backgroundColor = cssv('--ink');
  Chart.defaults.plugins.tooltip.titleColor = cssv('--bg');
  Chart.defaults.plugins.tooltip.bodyColor = cssv('--bg');
  Chart.defaults.plugins.tooltip.padding = 10;
  Chart.defaults.plugins.tooltip.cornerRadius = 6;
  Chart.defaults.animation.duration = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 500;
}
/* ---------- Colour helpers ---------- */
function hexRgb(h){ h=String(h).trim(); if(h.startsWith('rgb')){ const m=h.match(/[\d.]+/g).map(Number); return m.slice(0,3); }
  h=h.replace('#',''); if(h.length===3) h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return [n>>16&255,n>>8&255,n&255]; }
function shade(h,amt){ const [r,g,b]=hexRgb(h); const f=c=>Math.round(amt<0?c*(1+amt):c+(255-c)*amt); return `rgb(${f(r)},${f(g)},${f(b)})`; }
function lum(h){ const [r,g,b]=hexRgb(h); return (0.299*r+0.587*g+0.114*b)/255; }
const LBL_FONT = '600 11px "IBM Plex Sans", system-ui, sans-serif';
let LOOK = '3d'; try{ LOOK = localStorage.getItem('mge-look') || '3d'; }catch(e){}
const is3D = () => LOOK === '3d';
const colorAt = (ds,i) => Array.isArray(ds._c) ? ds._c[i % ds._c.length] : ds._c;
function rectOf(el, horiz){
  const p = el.getProps(['x','y','base','width','height'], true);
  return horiz ? {L:Math.min(p.x,p.base), R:Math.max(p.x,p.base), T:p.y-p.height/2, B:p.y+p.height/2}
               : {L:p.x-p.width/2, R:p.x+p.width/2, T:Math.min(p.y,p.base), B:Math.max(p.y,p.base)};
}
function depthOf(chart){
  const horiz = chart.options.indexAxis==='y'; let th = 40;
  chart.data.datasets.forEach((ds,di)=>{ const m=chart.getDatasetMeta(di); if(m.type==='bar'&&m.data[0]){ const r=rectOf(m.data[0],horiz); th=Math.min(th, horiz? r.B-r.T : r.R-r.L); } });
  return Math.max(4, Math.min(11, th*0.32));
}
function poly(ctx, pts, fill){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); pts.slice(1).forEach(p=>ctx.lineTo(p[0],p[1])); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); }

/* 3D extrusion: draws a lit top face and a shaded side face behind every bar. Bar heights stay true to the value. */
const depthPlugin = {
  id:'depth3d',
  beforeDatasetsDraw(chart){
    if(!is3D()) return; const ctx=chart.ctx, horiz=chart.options.indexAxis==='y', D=depthOf(chart); chart.$D=D;
    ctx.save();
    chart.data.datasets.forEach((ds,di)=>{ const m=chart.getDatasetMeta(di); if(m.type!=='bar'||!chart.isDatasetVisible(di)) return;
      m.data.forEach((el,i)=>{ const v=ds.data[i]; if(!v) return; const r=rectOf(el,horiz); if(r.R-r.L<1&&r.B-r.T<1) return; const c=colorAt(ds,i);
        poly(ctx,[[r.R,r.T],[r.R+D,r.T-D],[r.R+D,r.B-D],[r.R,r.B]], shade(c,-0.35));   // side
        poly(ctx,[[r.L,r.T],[r.R,r.T],[r.R+D,r.T-D],[r.L+D,r.T-D]], shade(c,0.28));    // top
      }); });
    ctx.restore();
  },
  beforeDatasetDraw(chart,args){ if(!is3D()) return; const m=args.meta, ctx=chart.ctx;
    if(m.type==='line'){ const c=chart.data.datasets[args.index].borderColor; ctx.save(); ctx.shadowColor='rgba(0,0,0,.28)'; ctx.shadowBlur=10; ctx.shadowOffsetY=6; chart.$lineShadow=true; } },
  afterDatasetDraw(chart){ if(chart.$lineShadow){ chart.ctx.restore(); chart.$lineShadow=false; } }
};

/* Value labels on every bar, stack and line point. */
const valuePlugin = {
  id:'valueLabels',
  afterDatasetsDraw(chart){
    const o = chart.options.plugins.valueLabels || {}; if(o.display===false) return;
    const ctx=chart.ctx, horiz=chart.options.indexAxis==='y', D=is3D()?(chart.$D||depthOf(chart)):0;
    const ink=cssv('--ink'), halo=cssv('--surface');
    const valAxis = chart.options.scales && chart.options.scales[horiz?'x':'y'];
    const stacked = !!(valAxis && valAxis.stacked);
    const stacks = {};
    ctx.save(); ctx.font=LBL_FONT; ctx.lineJoin='round';
    const txt = (s,x,y,align,col,haloOn=true) => { ctx.textAlign=align; ctx.textBaseline='middle'; if(haloOn){ ctx.lineWidth=3.5; ctx.strokeStyle=halo; ctx.strokeText(s,x,y); } ctx.fillStyle=col; ctx.fillText(s,x,y); };
    chart.data.datasets.forEach((ds,di)=>{
      const m=chart.getDatasetMeta(di); if(!chart.isDatasetVisible(di)) return;
      const fmt = v => (ds.lblPrefix||'') + (ds.lbl==='pct' ? v.toFixed(0)+'%' : ds.lbl==='int' ? Math.round(v).toLocaleString('en-US') : short(v));
      if(m.type==='line'){
        if(ds.labels===false) return;
        m.data.forEach((pt,i)=>{ const v=ds.data[i]; if(v==null||(ds.labelIdx&&!ds.labelIdx.includes(i))) return; txt(fmt(v), pt.x, pt.y-13, 'center', ds.borderColor||ink); });
        return;
      }
      if(m.type!=='bar') return;
      m.data.forEach((el,i)=>{ const v=ds.data[i]; if(!v) return; const r=rectOf(el,horiz);
        if(stacked){
          const len = horiz ? r.R-r.L : r.B-r.T, th = horiz ? r.B-r.T : r.R-r.L; const s=fmt(v);
          const tw = ctx.measureText(s).width;
          if(horiz ? (len > tw + 10 && th > 14) : (len > 17 && th > tw + 8)){
            const c=colorAt(ds,i); txt(s, (r.L+r.R)/2, (r.T+r.B)/2, 'center', lum(c)>0.62?'#14181D':'#FFFFFF', false);
          }
          const key=i+'|'+(ds.stack||'_'); const S=stacks[key]||(stacks[key]={tot:0,r:null});

/* Applies the 3D or flat look to a chart config and reserves room for labels. */
function applyLook(cfg){
  const horiz = cfg.options && cfg.options.indexAxis==='y';
  const hasLine = cfg.type==='line' || cfg.data.datasets.some(d=>d.type==='line');
  cfg.data.datasets.forEach(ds=>{
    const type = ds.type || cfg.type;
    if(type==='bar'){
      ds._c = ds.backgroundColor;
      if(is3D()){
        ds.borderRadius = 0;
        ds.backgroundColor = c => { const chart=c.chart, a=chart.chartArea, base=colorAt(ds, c.dataIndex||0); if(!a) return base;
          const g = horiz ? chart.ctx.createLinearGradient(a.left,0,a.right,0) : chart.ctx.createLinearGradient(0,a.bottom,0,a.top);
          g.addColorStop(0, shade(base,-0.14)); g.addColorStop(1, shade(base,0.16)); return g; };
        ds.categoryPercentage = ds.categoryPercentage || 0.72;
      }
    }
    if(type==='line' && is3D() && ds.borderWidth) ds.borderWidth = ds.borderWidth + 0.5;
  });
  cfg.options = cfg.options || {};
  const pad = cfg.options.layout && cfg.options.layout.padding || {};
  cfg.options.layout = {padding:{top:(pad.top||0)+26, right:(pad.right||0)+(horiz?64:hasLine?30:14), left:pad.left||0, bottom:pad.bottom||0}};
  return cfg;
}

function ytd(list, year){ const s=Date.UTC(year,0,1), e=Date.UTC(year,TODAY.getUTCMonth(),TODAY.getUTCDate()); return list.filter(p=>p.lpoD&&p.lpoD>=s&&p.lpoD<=e); }
function billingRunway(vs){
  const out = MONTHS.map(m => ({m:m.l, past:m.past, plan:0, act:0, high:0, med:0, risk:0}));
  vs.forEach(v => MONTHS.forEach((m,i) => {
    out[i].plan += v.plan[i]; out[i].act += v.act[i];
    // Current and future months: split the not-yet-invoiced part of the plan by job confidence
    if(!m.past){ const rem = Math.max(0, v.plan[i]-v.act[i]); if(rem){ const c = v.conf==='paid'?'high':v.conf; out[i][c]+=rem; } }
  }));

}
const runSum = (run, ms, k) => sum(ms, m => run[m.i][k]);
function healthScores(ps, vs, allPs){
  const yr = TODAY.getUTCFullYear();
  const cur = sum(ytd(allPs,yr),p=>p.v), prev = sum(ytd(allPs,yr-1),p=>p.v);
  const growth = prev ? (cur-prev)/prev : null;
  const sGrowth = growth==null ? 50 : Math.max(0,Math.min(100, 60 + growth*60));
  const lp = LASTM ? sum(vs,v=>v.plan[LASTM.i]) : 0, la = LASTM ? sum(vs,v=>v.act[LASTM.i]) : 0;
  const sBill = lp ? Math.max(0,Math.min(100, la/lp*100)) : 50;
  const live = ps.filter(p=>p.st==='OPEN PO'||p.st==='IN PROGRESS');
  const lateV = sum(live.filter(p=>p.late),p=>p.v), liveV = sum(live,p=>p.v);
  const sDel = liveV ? Math.max(0, 100 - lateV/liveV*100*1.5) : 100;
  const cl = Object.values(groupBy(allPs.filter(p=>p.yr===yr),'cl')).map(a=>sum(a,p=>p.v)).sort((a,b)=>b-a);
  const top = cl.length ? cl[0]/sum(cl) : 0;
  const sConc = Math.max(0, Math.min(100, 100 - Math.max(0, top-0.2)*160));
  const issues = RAW.dq.length; const sData = Math.max(0, 100 - issues/allPs.length*100*1.6);
  const parts = [{k:'Order growth',v:sGrowth},{k:'Billing delivery',v:sBill},{k:'Schedule',v:sDel},{k:'Client spread',v:sConc},{k:'Data hygiene',v:sData}];
  return {overall: Math.round(sum(parts,p=>p.v)/parts.length), parts, growth, top};
}

  </div>
  <div class="grid g-12">

/* ---------------- CLOSE-OUT ---------------- */
function vCloseout(){
  const ps = fP();
  const done = ps.filter(p=>p.st==='WORK COMPLETED').sort((a,b)=>b.v-a.v);
  const svc = ps.filter(p=>p.grp!=='SUPPLY' && p.yr>=Y-1 && (p.afD || p.st==='WORK COMPLETED' || p.st==='INVOICED'));
  const steps = [['Work finished',svc],['Final report issued',svc.filter(p=>p.repOk)],['WCC submitted',svc.filter(p=>p.wsOk)],['WCC approved',svc.filter(p=>p.waOk)],['Service entry created',svc.filter(p=>p.seOk)],['Invoice number recorded',svc.filter(p=>p.invOk)]];
  const dd = (a,b) => median(ps.filter(p=>isD(p[a])&&isD(p[b])).map(p=>(pd(p[b])-pd(p[a]))/DAY).filter(d=>d>=0&&d<365));
  const t1 = dd('af','ws'), t2 = dd('ws','wa'), t3 = dd('wa','sed');
  const noInv = ps.filter(p=>p.st==='INVOICED'&&!p.invOk), jcOpen = ps.filter(p=>p.st==='INVOICED'&&p.jc==='OPEN');
  const pendVal = done.filter(p=>p.val==null);
  $('#view').innerHTML = `<div class="view">
  <div class="kpis">

    ${kpi('Without a PO value',{text:n0(pendVal.length)},'completed lines that cannot be invoiced yet')}
    ${kpi('Finish → WCC submitted',{text:t1!=null?Math.round(t1)+' days':'—'},'median')}
    ${kpi('WCC submitted → approved',{text:t2!=null?Math.round(t2)+' days':'—'},'median, client side')}
    ${kpi('WCC approved → service entry',{text:t3!=null?Math.round(t3)+' days':'—'},'median, client side')}
    ${kpi('Invoiced, no invoice no.',{text:`<span class="${noInv.length?'warnt':''}">${noInv.length}</span>`},'audit trail gap')}
  </div>
  <div class="grid g-12">
    ${panel('span-6',`Close-out pipeline, service jobs ${Y-1}–${String(Y).slice(2)}`,'Where does paperwork stall between finishing a job and getting paid?',
      `<div class="funnel">${steps.map(([l,a],i)=>`<div class="f-row"><span>${l}</span><div class="f-bar"><i style="width:${svc.length?a.length/svc.length*100:0}%;background-color:${i===0?'var(--s-inv)':i===5?'var(--green)':'var(--s-prog)'}"></i>${a.length?`<b>${aed(sum(a,p=>p.v))}</b>`:''}</div><span class="r num">${a.length} <small style="color:var(--muted)">(${pct(svc.length?a.length/svc.length:0)})</small></span></div>`).join('')}</div>
       <div class="take"><b>Reading it:</b> the gap between “Work finished” and “WCC submitted” is the part MGE controls. Gaps after that are client-side and need follow-up, not engineering time. Some older rows record documents as “-”, so steps may read lower than reality.</div>`)}
    ${panel('span-6','Ready to bill now','Work completed lines, largest first. Select a row for the full record.',
      done.length?`<div class="tbl-wrap" style="max-height:420px;overflow:auto"><table><thead><tr><th>Job</th><th class="r">Value</th><th>Report</th><th>WCC</th><th>Note</th></tr></thead><tbody>${done.map(p=>`<tr class="click" data-id="${p.id}" tabindex="0"><td class="desc"><b>${esc(p.so||'—')}</b><small>${esc(p.ds)} · ${esc(p.cl)}</small></td><td class="r num">${p.val!=null?short(p.val):'<span class="warnt">PO pending</span>'}</td><td>${p.repOk?'✓':'<span class="warnt">Missing</span>'}</td><td>${p.waOk?'Approved':p.wsOk?'Submitted':'<span class="warnt">Not yet</span>'}</td><td style="font-size:12.5px;min-width:160px">${esc(p.note||p.note40||'')}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty"><b>Nothing waiting</b>No lines are at Work completed for these filters.</div>')}
    ${panel('span-12','Control gaps in the invoicing record','These do not lose money directly, but they make billing hard to audit and easy to miss.',

  </div></div>`;

    y25:sum(all.filter(p=>p.yr===Y-1),p=>p.v), y26:sum(all.filter(p=>p.yr===Y),p=>p.v), last:Math.max(0,...all.map(p=>p.lpoD?+p.lpoD:0))}; }).sort((a,b)=>b.v-a.v);

/* ---------------- REGISTER ---------------- */
let regSort = {k:'lpoD',dir:-1}, regPage = 0; const PAGE = 25;
const REG_COLS = [
  {k:'so',l:'SO #'},{k:'ds',l:'Job'},{k:'cl',l:'Client'},{k:'grp',l:'Line'},{k:'st',l:'Status'},{k:'pct',l:'Progress'},{k:'val',l:'PO value',r:1},{k:'lpoD',l:'LPO date'},{k:'pfD',l:'Planned finish'},{k:'pe',l:'Engineer'},{k:'inv',l:'Invoice no.'}];
function vRegister(){
  const ps = fP();
  const s = [...ps].sort((a,b)=>{ let x=a[regSort.k], y=b[regSort.k]; if(x instanceof Date||y instanceof Date){x=x?+x:-Infinity;y=y?+y:-Infinity;} if(x==null)x=-Infinity; if(y==null)y=-Infinity; return (x>y?1:x<y?-1:0)*regSort.dir; });
  const pages = Math.max(1,Math.ceil(s.length/PAGE)); regPage = Math.min(regPage,pages-1);
  const rows = s.slice(regPage*PAGE,(regPage+1)*PAGE);
  $('#view').innerHTML = `<div class="view">
   <section class="panel"><div class="panel-head"><div><h3>${s.length} job lines</h3><div class="q">${aed(sum(s,p=>p.v))} total PO value. Sort by any column; select a row to see its full lifecycle.</div></div></div>
   ${s.length?`<div class="tbl-wrap"><table><thead><tr>${REG_COLS.map(c=>`<th class="${c.r?'r':''}" aria-sort="${regSort.k===c.k?(regSort.dir>0?'ascending':'descending'):'none'}"><button data-k="${c.k}">${c.l}</button></th>`).join('')}</tr></thead><tbody>
   ${rows.map(p=>`<tr class="click" data-id="${p.id}" tabindex="0"><td style="white-space:nowrap">${esc(p.so||'—')}</td><td class="desc">${esc(p.ds)}</td><td>${esc(p.cl)}</td><td>${GROUP_LABEL[p.grp]||esc(p.grp)}</td><td>${pill(p.st)}</td><td>${progBar(p.pct)}</td><td class="r num" title="${full(p.val)}">${p.val!=null?short(p.val):'<span class="warnt">Pending</span>'}</td><td style="white-space:nowrap">${fmtDate(p.lpoD)}</td><td style="white-space:nowrap" class="${p.late?'down':''}">${fmtDate(p.pfD)}</td><td>${esc(titleCase(p.pe||'—'))}</td><td style="white-space:nowrap">${esc(p.invOk?p.inv:'—')}</td></tr>`).join('')}
   </tbody></table></div>
   <div class="pager"><span>Showing ${regPage*PAGE+1}–${Math.min(s.length,(regPage+1)*PAGE)} of ${s.length}</span><div class="btns"><button class="btn" id="pPrev" ${regPage===0?'disabled':''}>Previous</button><button class="btn" id="pNext" ${regPage>=pages-1?'disabled':''}>Next</button></div></div>`
   : emptyState('No job lines match','Change the search or filters.')}
   </section></div>`;
  document.querySelectorAll('th button').forEach(b=>b.addEventListener('click',()=>{ const k=b.dataset.k; regSort = regSort.k===k?{k,dir:-regSort.dir}:{k,dir:(k==='val'||k==='lpoD'||k==='pfD'||k==='pct')?-1:1}; regPage=0; vRegister(); }));
  if($('#pPrev')){ $('#pPrev').addEventListener('click',()=>{regPage--; vRegister();}); $('#pNext').addEventListener('click',()=>{regPage++; vRegister();}); }
  bindRows();
  exportRows = () => regExport(s, 'mge-project-register.csv');
}
function regExport(list, name){
  return {name, head:['Row','Year','SO','Description','Business line','Principal','Client','Job card','Status','Progress','LPO date','Customer order','PO value','Planned start','Planned finish','Actual start','Actual finish','Days past planned finish','Project engineer','Service engineer','Final report','WCC ref','WCC submitted','WCC approved','Service entry date','Service entry no.','Invoice no.','Week 41 note'],
    rows:list.map(p=>[p.id,p.yr,p.so,p.ds,p.grp,p.co,p.cl,p.jc,p.st,p.pct,p.lpo,p.cpo,p.val??'',p.ps,p.pf,p.as,p.af,p.daysLate||'',p.pe,p.se,p.rep,p.wr,p.ws,p.wa,p.sed,p.sen,p.inv,p.note])};
}

  $('#view').innerHTML = `<div class="view grid g-12">
   ${panel('span-12','Why this page exists','A dashboard is only as good as the tracker behind it. These items were found while building it. Fixing them takes the team about a day and makes every number above audit-ready.',
     `<div class="mini-stats"><div class="r"><span class="num">${RAW.dq.length}</span><span>Issues found</span></div><div class="b"><span class="num">${P.length}</span><span>Job lines in ${esc(RAW.sheets?RAW.sheets.projects:'register')}</span></div><div class="b"><span class="num">${V.length}</span><span>Invoice-plan lines in ${esc(RAW.sheets?RAW.sheets.invoices:'plan')}</span></div><div class="a"><span class="num">${V.filter(v=>!v.proj).length}</span><span>Invoice lines with no matching SO in the register</span></div></div>
      <div class="take"><b>Structural observations (from the October 2026 tracker):</b> (1) Actual start equals planned start on almost every row, and planned finish matches actual finish on most completed jobs, so the original baseline appears to be overwritten; keep a separate baseline column to measure slippage honestly. (2) The KHAN sheet has no invoice date, due date or receipts, so receivables and DSO cannot be measured. (3) PO value is recorded per job line; several lines share one customer PO, which is correct but means PO-level totals need the line split kept intact.</div>`)}
   <div class="span-12">${Object.entries(g).sort((a,b)=>b[1].length-a[1].length).map(([k,a])=>`<details class="dq-grp"><summary><span class="dot ${a.length>10?'r':'a'}" style="width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px">!</span>${esc(k)}<span class="n">${a.length}</span></summary><p style="margin:0 16px 10px 36px;font-size:13px">${esc(fix[k]||'')}</p><ul>${a.map(x=>`<li>${esc(x[1])}</li>`).join('')}</ul></details>`).join('')}</div>
  </div>`;
}

/* ============================================================
   DRAWER
   ============================================================ */
let lastFocus = null;
function openDrawer(p){
  if(!p) return; lastFocus = document.activeElement;
  $('#dSub').textContent = `${p.so||'No SO'}${p.cpo?' · PO '+p.cpo:''}`;
  $('#dTitle').textContent = p.ds;
  const step = (l,s,ok,kind) => `<li><span class="s ${kind==='plan'?(ok?'plan':''):ok?'ok':(kind==='due'?'miss':'')}"></span><span>${l}${kind==='due'?' <small class="warnt">overdue</small>':''}</span><em>${s||'—'}</em></li>`;
  const dtxt = s => isD(s)?fmtDate(pd(s)):(s&&s!=='-'?esc(s):'');
  const inv = V.filter(v=>v.proj===p);
  $('#dBody').innerHTML = `
   <div class="facts">
    <div><span>Client</span><b>${esc(p.cl)}</b></div><div><span>Status</span><b>${pill(p.st)}</b></div>
    <div><span>PO value</span><b class="num">${full(p.val)}</b></div><div><span>Progress</span><b>${progBar(p.pct)}</b></div>
    <div><span>Business line / principal</span><b>${GROUP_LABEL[p.grp]||esc(p.grp)} / ${esc(p.co)}</b></div><div><span>Tracker year</span><b>${p.yr||'—'}</b></div>
    <div><span>Project engineer</span><b>${esc(titleCase(p.pe||'—'))}</b></div><div><span>Service engineer</span><b>${esc(titleCase(p.se||'—'))}</b></div>
   </div>
   ${p.late?`<div class="note" style="background:var(--brand-soft)"><b style="color:var(--brand-ink)">Past planned finish</b>${p.daysLate} days over the planned finish of ${fmtDate(p.pfD)}.</div>`:''}
   <h4 style="font-size:14px;margin:4px 0 8px">Lifecycle <small style="font-weight:400;color:var(--muted);font-family:var(--body);font-size:12px">solid = done, dashed = planned</small></h4>
   <ul class="steps">
    ${step('LPO received',fmtDate(p.lpoD),!!p.lpoD)}
    ${step('Planned start',fmtDate(p.psD),!!p.psD,'plan')}
    ${step('Actual start',fmtDate(p.asD),!!p.asD)}
    ${step('Planned finish',fmtDate(p.pfD),!!p.pfD,'plan')}
    ${step('Actual finish',fmtDate(p.afD),!!p.afD,(!p.afD&&p.late)?'due':'')}
    ${step('Final report',dtxt(p.rep)||null,p.repOk)}
    ${step('WCC submitted',dtxt(p.ws)||null,p.wsOk)}
    ${step('WCC approved',dtxt(p.wa)||null,p.waOk)}
    ${step('Service entry',(dtxt(p.sed)||'')+(p.sen&&p.sen!=='-'?' · '+esc(p.sen):'')||null,p.seOk)}
    ${step('Invoice',p.invOk?esc(p.inv)+(p.ia&&p.ia!=='-'?' · '+esc(p.ia):''):null,p.invOk)}
   </ul>
   ${p.note?`<div class="note"><b>${WEEK.cur} update</b>${esc(p.note)}</div>`:''}
   ${p.note40&&p.note40!==p.note?`<div class="note"><b>${WEEK.prev} update</b>${esc(p.note40)}</div>`:''}
   ${inv.length?`<h4 style="font-size:14px;margin:16px 0 8px">In the invoice plan</h4>${inv.map(v=>`<div class="facts"><div><span>Invoice amount</span><b class="num">${full(v.amt)}</b></div><div><span>Raised</span><b class="num">${full(v.raised)}</b></div><div><span>Balance</span><b class="num">${full(v.bal)}</b></div><div><span>Planned month</span><b>${fmtDate(v.imD)}</b></div><div><span>Confidence</span><b><span class="pill ${CONF_CLS[v.conf]}">${CONF_LABEL[v.conf]}</span></b></div><div><span>Payment</span><b>${esc(v.pay||'Not recorded')}</b></div></div>`).join('')}`:''}
   <p style="font-size:12px;color:var(--muted)">Source: ${esc(RAW.sheets?RAW.sheets.projects:'register')} sheet, row ${p.id}.</p>`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false');
  setTimeout(()=>$('#dClose').focus(),50);
}
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); if(lastFocus) lastFocus.focus(); }
$('#dClose').addEventListener('click',closeDrawer); $('#scrim').addEventListener('click',closeDrawer);
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && $('#drawer').classList.contains('open')) closeDrawer(); });

/* ============================================================
   THEME, TOAST, EXPORT
   ============================================================ */
function toast(m){ const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function isDark(){ const a=document.documentElement.getAttribute('data-theme'); return a ? a==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function syncThemeBtn(){ $('#themeBtn span').textContent = isDark() ? 'Light' : 'Dark'; }
try{ const t=localStorage.getItem('mge-theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
function syncLook(){ document.documentElement.setAttribute('data-look', LOOK); $('#lookBtn').setAttribute('aria-pressed', is3D()); $('#lookBtn span').textContent = is3D() ? '3D charts' : 'Flat charts'; }
syncLook();
$('#lookBtn').addEventListener('click',()=>{ LOOK = is3D() ? 'flat' : '3d'; try{localStorage.setItem('mge-look',LOOK);}catch(e){} syncLook(); if(P) render(); });
$('#themeBtn').addEventListener('click',()=>{ const n=isDark()?'light':'dark'; document.documentElement.setAttribute('data-theme',n); try{localStorage.setItem('mge-theme',n);}catch(e){} syncThemeBtn(); chartDefaults(); render(); });
let downloads = null, exportRows = null;
const csvCell = v => { if(v==null) return ''; const s=String(v); return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s; };
$('#exportBtn').addEventListener('click', async ()=>{
  if(!exportRows) return; const {name,head,rows} = exportRows();
  const csv = '\ufeff'+[head,...rows].map(r=>r.map(csvCell).join(',')).join('\n');
  if(downloads){ // running inside a claude.ai artifact
    try{ await downloads.save({filename:name,data:csv}); toast(`Saved ${name} (${rows.length} rows, current filters)`); }
    catch(e){ if(e&&e.code==='declined') return; toast(e&&e.code==='rate_limited'?'A save prompt is already open.':'Export is not available in this view.'); }
    return;
  }
  // standalone browser: plain file download
  const url = URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  const a = document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000); toast(`Downloaded ${name} (${rows.length} rows, current filters)`);
});
(async()=>{ try{ if(window.claude&&window.claude.use){ downloads = await window.claude.use('downloads'); } }catch(e){} })();

/* ============================================================
   BOOT
   ============================================================ */
function start(raw){
  try{ initData(raw); }
  catch(e){ showLoader('data.json was read but could not be used: '+e.message); return; }
  $('#sideFoot').innerHTML = `<strong>Data as of ${fmtDate(TODAY)}</strong><br>Source: ${esc(RAW.source||'tracker workbook')}${RAW.sheets?`, sheets ${esc(RAW.sheets.projects)} (project register) and ${esc(RAW.sheets.invoices)} (invoice plan)`:''}. All values in AED.${RAW.generated?`<br>Converted ${esc(RAW.generated.replace('T',' '))}`:''}`;
  chartDefaults(); syncThemeBtn(); buildNav(); buildFilters(); renderChips(); render();
}
function showLoader(msg){
  $('#title').textContent = 'Load the tracker data';
  $('#view').innerHTML = `<section class="panel" style="max-width:640px">
    <h3>The dashboard needs data.json</h3>
    <p class="q" style="margin:8px 0 14px">${esc(msg)}</p>
    <p style="margin:0 0 14px;font-size:13.5px">Browsers block pages opened straight from disk from reading other files. Either serve the folder (run <code>python -m http.server 8000</code> in it, then open <code>http://localhost:8000</code>) or choose the file below.</p>
    <label class="btn primary" style="width:max-content;cursor:pointer">Choose data.json<input type="file" id="pick" accept=".json,application/json" style="display:none"></label>
  </section>`;
  $('#pick').addEventListener('change', e => { const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload = () => { try{ start(JSON.parse(rd.result)); }catch(err){ showLoader('That file is not valid JSON: '+err.message); } }; rd.readAsText(f); });
}
(async function boot(){
  if(window.MGE_DATA){ start(window.MGE_DATA); return; }            // optional: data embedded via <script src="data.js">
  try{
    const r = await fetch('data.json', {cache:'no-store'});
    if(!r.ok) throw new Error('data.json returned HTTP '+r.status+'.');
    start(await r.json());
  }catch(e){ showLoader(e.message.includes('HTTP') ? e.message : 'data.json could not be read from this location.'); }
})();
</script>
</body>
</html>
